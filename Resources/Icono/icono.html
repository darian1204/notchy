<!doctype html>
<!-- Ícono de Notchy: la isla brillante sobre vidrio oscuro, con la n de Notchy. Simétrico y con paleta
     fija: tinta #14101F, lila #F4F1FF, violeta #7B5CFF. Se renderiza a 1024 × 1024 con transparencia
     y de ahí salen todos los tamaños del AppIcon (scripts/icono). Rejilla de macOS: cuerpo de 824 con
     100 de margen. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cuerpo"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2540"/><stop offset="1" stop-color="#0E0C14"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity=".75"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="isla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DEFF"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="recorteN"><rect x="402" y="432" width="220" height="176"/></clipPath>
  </defs>

  <g clip-path="url(#cuerpo)">
    <rect x="100" y="100" width="824" height="824" fill="url(#vidrio)"/>
    <ellipse cx="512" cy="512" rx="380" ry="250" fill="url(#halo)"/>
    <rect x="212" y="372" width="600" height="280" rx="140" fill="url(#isla)"/>
    <!-- La n: arco simétrico, con las patas cortadas en recto -->
    <path clip-path="url(#recorteN)" d="M443.8 640 V533.2 Q443.8 465 512 465 Q580.2 465 580.2 533.2 V640"
          stroke="#14101F" stroke-width="55" fill="none" stroke-linecap="round"/>
    <rect x="100" y="100" width="824" height="320" fill="url(#brillo)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#borde)" stroke-width="4"/>
</svg>
</body>
</html>
