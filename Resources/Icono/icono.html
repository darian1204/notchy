<!doctype html>
<!-- Ícono de Notchy: el notch de una Mac abierto como isla, con carátula y espectro. Se renderiza a
     1024 × 1024 con transparencia y de ahí salen todos los tamaños del AppIcon (scripts/icono).
     Rejilla de macOS: cuerpo de 824 con 100 de margen. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cuerpo"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- Fondo de pantalla: violeta arriba, rosa y naranja abajo. -->
    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a1747"/>
      <stop offset="0.45" stop-color="#7a2a6e"/>
      <stop offset="0.8" stop-color="#e0628a"/>
      <stop offset="1" stop-color="#ffa36b"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.75" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#ffd2a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd2a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caratula" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/><stop offset="0.5" stop-color="#e0628a"/><stop offset="1" stop-color="#a03dff"/>
    </linearGradient>
    <linearGradient id="reflejo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#12051f" flood-opacity="0.55"/>
    </filter>
    <filter id="brilla" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g clip-path="url(#cuerpo)">
    <rect x="100" y="100" width="824" height="824" fill="url(#fondo)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#luz)"/>
    <!-- Borde de la pantalla y la isla que baja de él, con hombros cóncavos. -->
    <path filter="url(#sombra)" fill="#000" d="
      M100 100 H924 V196 H822
      Q790 196 790 228
      V318 Q790 412 696 412
      H328 Q234 412 234 318
      V228 Q234 196 202 196
      H100 Z"/>
    <!-- Reflejo de vidrio arriba del cuerpo. -->
    <rect x="100" y="100" width="824" height="420" fill="url(#reflejo)" opacity="0.35"/>
  </g>

  <!-- Carátula -->
  <rect x="290" y="244" width="120" height="120" rx="32" fill="url(#caratula)" filter="url(#brilla)" opacity="0.7"/>
  <rect x="290" y="244" width="120" height="120" rx="32" fill="url(#caratula)"/>
  <!-- Espectro -->
  <g fill="#f2a9c3">
    <g filter="url(#brilla)" opacity="0.6">
      <rect x="600" y="286" width="22" height="56" rx="11"/><rect x="638" y="250" width="22" height="92" rx="11"/>
      <rect x="676" y="272" width="22" height="70" rx="11"/><rect x="714" y="304" width="22" height="38" rx="11"/>
    </g>
    <rect x="600" y="286" width="22" height="56" rx="11"/><rect x="638" y="250" width="22" height="92" rx="11"/>
    <rect x="676" y="272" width="22" height="70" rx="11"/><rect x="714" y="304" width="22" height="38" rx="11"/>
  </g>
  <!-- Contorno sutil del cuerpo -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#fff" stroke-opacity="0.12"/>
</svg>
</body>
</html>
