<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="440" fill="url(#f)"/>

  <!-- texto -->
  <text x="80" y="120" fill="#f472b6" font-size="15" font-weight="700" letter-spacing="2">REUNIONES</text>
  <text x="80" y="170" fill="#fff" font-size="40" font-weight="800" letter-spacing="-1">Tú hablas.</text>
  <text x="80" y="218" fill="#fff" font-size="40" font-weight="800" letter-spacing="-1">Notchy toma nota.</text>
  <text x="80" y="266" fill="#a1a1aa" font-size="18">Graba tu micrófono y el audio de la llamada,</text>
  <text x="80" y="292" fill="#a1a1aa" font-size="18">transcribe en vivo en tu Mac y copia todo</text>
  <text x="80" y="318" fill="#a1a1aa" font-size="18">con un clic. Nada sale a la nube.</text>

  <!-- isla -->
  <g filter="url(#s)">
    <rect x="560" y="60" width="640" height="320" rx="36" fill="#000"/>
  </g>
  <circle cx="598" cy="98" r="7" fill="#ef4444"/>
  <text x="614" y="104" fill="#fff" font-size="16" font-weight="700">Sync de producto</text>
  <text x="1164" y="104" fill="#a1a1aa" font-size="15" text-anchor="end">23:41</text>

  <g font-size="16">
    <text x="592" y="152" fill="#f472b6" font-weight="700">Tú</text>
    <text x="642" y="152" fill="#71717a">00:12</text>
    <text x="700" y="152" fill="#f4f4f5">¿Cerramos el diseño del onboarding hoy?</text>

    <text x="592" y="190" fill="#38bdf8" font-weight="700">Otros</text>
    <text x="642" y="190" fill="#71717a">00:18</text>
    <text x="700" y="190" fill="#f4f4f5">Sí, mando los cambios antes de las 5.</text>

    <text x="592" y="228" fill="#f472b6" font-weight="700">Tú</text>
    <text x="642" y="228" fill="#71717a">00:25</text>
    <text x="700" y="228" fill="#f4f4f5">Perfecto, lo reviso mañana temprano.</text>

    <text x="592" y="266" fill="#38bdf8" font-weight="700">Otros</text>
    <text x="642" y="266" fill="#71717a">00:31</text>
    <text x="700" y="266" fill="#a1a1aa" font-style="italic">Y agendamos la demo para el jueves…</text>
  </g>

  <!-- barra inferior -->
  <rect x="592" y="300" width="70" height="6" rx="3" fill="#3f3f46"/>
  <rect x="592" y="300" width="48" height="6" rx="3" fill="#f472b6"/>
  <rect x="672" y="300" width="70" height="6" rx="3" fill="#3f3f46"/>
  <rect x="672" y="300" width="36" height="6" rx="3" fill="#38bdf8"/>

  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="828" y="324" width="104" height="34" rx="17" fill="#14532d"/>
    <text x="880" y="346" fill="#bbf7d0">✓ Copiada</text>
    <rect x="942" y="324" width="90" height="34" rx="17" fill="#27272a"/>
    <text x="987" y="346" fill="#e4e4e7">⚑ Marca</text>
    <rect x="1042" y="324" width="126" height="34" rx="17" fill="#f472b6"/>
    <text x="1105" y="346" fill="#18181b">■ Guardar</text>
  </g>
</svg>
