<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#062a2e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caratula" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="620" fill="url(#fondo)"/>
  <rect width="1280" height="620" fill="url(#brillo)"/>

  <!-- borde superior de la pantalla -->
  <rect x="140" y="0" width="1000" height="14" rx="0" fill="#05050a" opacity="0.9"/>

  <!-- la isla del notch -->
  <g filter="url(#sombra)">
    <path d="M300 0 H980 V200 a34 34 0 0 1 -34 34 H334 a34 34 0 0 1 -34 -34 Z" fill="#000"/>
  </g>

  <!-- Ahora suena -->
  <rect x="330" y="34" width="86" height="86" rx="16" fill="url(#caratula)"/>
  <circle cx="373" cy="77" r="14" fill="#000" opacity="0.35"/>
  <text x="432" y="62" fill="#fff" font-size="19" font-weight="700">Midnight City</text>
  <text x="432" y="86" fill="#a1a1aa" font-size="15">M83 · letra en vivo</text>
  <rect x="432" y="104" width="190" height="5" rx="2.5" fill="#3f3f46"/>
  <rect x="432" y="104" width="118" height="5" rx="2.5" fill="#f472b6"/>
  <g fill="#fff">
    <path d="M446 140 l-12 8 l12 8 z"/>
    <rect x="474" y="140" width="5" height="16" rx="1.5"/>
    <rect x="484" y="140" width="5" height="16" rx="1.5"/>
    <path d="M512 140 l12 8 l-12 8 z"/>
  </g>
  <g fill="#f472b6">
    <rect x="560" y="146" width="5" height="10" rx="2"/>
    <rect x="569" y="138" width="5" height="18" rx="2"/>
    <rect x="578" y="142" width="5" height="14" rx="2"/>
    <rect x="587" y="134" width="5" height="22" rx="2"/>
    <rect x="596" y="144" width="5" height="12" rx="2"/>
    <rect x="605" y="139" width="5" height="17" rx="2"/>
  </g>

  <!-- divisor -->
  <rect x="652" y="38" width="1" height="150" fill="#27272a"/>

  <!-- Agenda -->
  <text x="676" y="56" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">HOY</text>
  <rect x="676" y="70" width="4" height="34" rx="2" fill="#38bdf8"/>
  <text x="690" y="84" fill="#fff" font-size="15" font-weight="600">Sync de producto</text>
  <text x="690" y="102" fill="#a1a1aa" font-size="13">10:30 · en 12 min</text>
  <rect x="676" y="118" width="4" height="34" rx="2" fill="#34d399"/>
  <text x="690" y="132" fill="#fff" font-size="15" font-weight="600">Entregar práctica 3</text>
  <text x="690" y="150" fill="#a1a1aa" font-size="13">Recordatorio · 18:00</text>

  <!-- chip de grabación -->
  <rect x="842" y="40" width="112" height="30" rx="15" fill="#3b0d14"/>
  <circle cx="862" cy="55" r="6" fill="#ef4444"/>
  <text x="876" y="60" fill="#fecaca" font-size="13" font-weight="600">REC 04:12</text>
  <rect x="842" y="82" width="112" height="30" rx="15" fill="#18181b"/>
  <text x="898" y="102" fill="#e4e4e7" font-size="13" text-anchor="middle">⌘ Clip ×12</text>
  <rect x="842" y="124" width="112" height="30" rx="15" fill="#18181b"/>
  <text x="898" y="144" fill="#e4e4e7" font-size="13" text-anchor="middle">☀︎ 24° Chih.</text>

  <!-- texto de venta -->
  <text x="640" y="350" fill="url(#titulo)" font-size="78" font-weight="800" text-anchor="middle" letter-spacing="-2">Notchy</text>
  <text x="640" y="402" fill="#e4e4e7" font-size="27" font-weight="500" text-anchor="middle">Tu notch, convertido en el centro de control de tu Mac.</text>
  <text x="640" y="440" fill="#a1a1aa" font-size="19" text-anchor="middle">Música, agenda, portapapeles, reuniones transcritas y un asistente — a un vistazo, sin abrir nada.</text>

  <!-- píldoras -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="318" y="492" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="393" y="518" fill="#f5f5f5">Privada</text>
    <rect x="484" y="492" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="559" y="518" fill="#f5f5f5">Sin anuncios</text>
    <rect x="650" y="492" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="725" y="518" fill="#f5f5f5">Apple Silicon</text>
    <rect x="816" y="492" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="891" y="518" fill="#f5f5f5">+15 módulos</text>
  </g>
</svg>
